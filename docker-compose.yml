version: "3.9"

services:
  bot:
    build: .
    image: trading-bot:latest
    container_name: trading_bot_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Persistent data: state, logs, models — survive container restarts
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      # Config is mounted read-write so UI can save changes
      - ./config.yaml:/app/config.yaml
    environment:
      # Override with real values in .env file (never commit .env!)
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Limit resources to avoid OOM on small VPS
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"
